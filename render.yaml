services:
  - type: web
    name: event-management-system
    runtime: docker
    plan: free
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: APP_ADMIN_USERNAME
        sync: false
      - key: APP_ADMIN_PASSWORD
        sync: false
      - key: APP_DEBUG
        value: "0"
      - key: APP_TRUST_PROXY
        value: "1"
      - key: PAYSTACK_MODE
        value: test
      - key: PAYSTACK_TEST_SECRET_KEY
        sync: false
      - key: PAYSTACK_TEST_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
